<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifecycle infographic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--bg:transparent;--tile:#dce8fd;--tile-on:#cfe0fc;--blue:#2188ff;--ink:#1d2433;--muted:#3b4458;--dwell:1000ms}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{display:grid;align-items:center;min-height:100%;background:var(--bg);padding:12px;max-width:1200px;margin:0 auto}
.wrap .grid{width:100%}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{position:relative;height:150px}
.tile{position:absolute;top:0;left:0;right:0;min-height:100%;background:var(--tile);border-radius:16px;padding:16px 16px 14px;overflow:hidden;outline:none;
  transition:min-height .45s cubic-bezier(.2,.8,.2,1),transform .45s cubic-bezier(.2,.8,.2,1),background .3s,box-shadow .45s}
.tile.active{transform:scale(1.045);background:var(--tile-on);z-index:2;
  box-shadow:0 0 0 1px rgba(81,216,238,.35),0 0 18px 2px rgba(81,216,238,.25),0 10px 24px rgba(0,0,0,.25)}
.tile.open{min-height:200px;transform:scale(1.07);z-index:3;
  box-shadow:0 0 0 1px rgba(81,216,238,.5),0 0 22px 3px rgba(81,216,238,.35),0 14px 30px rgba(0,0,0,.3)}
/* glowing ring: a bright arc travels once around the border per dwell */
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2.5px;pointer-events:none;opacity:0;transition:opacity .35s;
  background:conic-gradient(from var(--a),rgba(81,216,238,.1) 0 45%,var(--blue) 82%,#d5fbff 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tile.active::after{opacity:1;animation:spin var(--dwell) linear infinite}
.tile.open::after{animation:none;background:var(--blue)}
@keyframes spin{to{--a:180deg}}
.tile:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.icon{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin-bottom:8px}
h3{margin:0;font-weight:400;font-size:18px;line-height:1.08;color:var(--blue);white-space:pre-line;letter-spacing:-.01em}
.d{max-height:0;margin:0;overflow:hidden;color:var(--muted);font-size:11px;line-height:1.38;opacity:0;transform:translateY(5px);transition:max-height .45s cubic-bezier(.2,.8,.2,1),margin-top .45s cubic-bezier(.2,.8,.2,1),opacity .25s,transform .45s cubic-bezier(.2,.8,.2,1)}
.tile.open .d{max-height:90px;margin-top:12px;opacity:1;transform:none;transition-delay:.06s}
.plus{display:none;align-items:center;justify-content:center}
.plus svg{width:34px;height:34px;stroke:var(--blue);stroke-width:2}
@media (max-width:640px){.grid{grid-template-columns:repeat(3,1fr)}.cell{height:185px}.plus{display:none}}
@media (max-width:540px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.cell{height:175px}h3{font-size:18px}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.active,.tile.open{transform:none}.tile.active::after{animation:none;background:var(--blue)}}
</style>
</head>
<body>
<div class="wrap"><div class="grid" id="grid" aria-label="Content lifecycle"></div></div>

<script>
/* ===== CONTENT: edit tiles here. Order in this list = order on the page and in the loop. ===== */
var DWELL = 2000; // ms each tile stays highlighted (can also be set with ?dwell=4000 in the iframe URL)
var TILES = [
 {icon:"cloud",   title:"Ingest\n& Store",         text:"Centralize all visual media securely in one unified, highly available repository."},
 {icon:"search",  title:"Enrich\n& Find",          text:"Improve content discoverability with automated tagging and agentic search."},
 {icon:"image",   title:"Generate\n& Transform",   text:"Edit or create media dynamically on-the-fly utilizing APIs and advanced AI."},
 {icon:"devices", title:"Moderate\n& Align",       text:"Ensure strict brand consistency and digital content safety seamlessly at scale."},
 {icon:"send",    title:"Optimize\n& Deliver",     text:"Automatically serve the fastest, best version for every user, device, and network."},
 {icon:"headset", title:"Automate &\nOrchestrate", text:"Scale operations without increasing team workload using automated workflows and specialized AI agents."},
 {icon:"archive", title:"Manage\n& Govern", visible:false, text:"Organize, control, and protect assets with robust permissions and governance."}
];
var ICONS = {
  cloud:'<path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5 4 4 0 0 1 17.5 18"/><path d="M12 21v-8m0 0-3 3m3-3 3 3"/>',
  devices:'<rect x="3" y="5" width="13" height="10" rx="1.5"/><path d="M1.5 19h10M8 15v4"/><rect x="16.5" y="9" width="5" height="10" rx="1"/>',
  archive:'<rect x="4" y="3" width="16" height="5" rx="1"/><path d="M5 8v12h14V8M10 12.5h4"/>',
  search:'<path d="M12 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V12"/><path d="m5 18 4.5-5.5 3 3.5 2-2 3 4"/><circle cx="16" cy="7" r="3.2"/><path d="m18.4 9.4 2.4 2.4"/>',
  image:'<rect x="4" y="6" width="16" height="14" rx="1.5" fill="currentColor"/><path d="M4 3h2m4 0h2m4 0h2"/><path d="m6 18 4-5 3 3.5 2-2 3 3.5" stroke="#0b1220"/>',
  send:'<path d="M3 4.5 21 12 3 19.5v-6l9-1.5-9-1.5z"/>',
  headset:'<path d="M5 14v-2a7 7 0 0 1 14 0v2"/><rect x="3.5" y="13" width="3.5" height="6" rx="1.5"/><rect x="17" y="13" width="3.5" height="6" rx="1.5"/><path d="M19 19c0 1.7-2 2.5-5 2.5"/><path d="M9.5 11.5h.01M14.5 11.5h.01M10 15c1.3.8 2.7.8 4 0"/>'
};
/* ===== END CONTENT ===== */

var qs = new URLSearchParams(location.search);
if (qs.get("dwell")) DWELL = +qs.get("dwell") || DWELL;
document.documentElement.style.setProperty("--dwell", DWELL + "ms");

var grid = document.getElementById("grid");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
grid.innerHTML = TILES.filter(function(t){ return t.visible !== false; }).map(function(t){
  return '<div class="cell"><article class="tile" tabindex="0">' +
    '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[t.icon] || ICONS.cloud) + '</svg>' +
    '<h3>' + esc(t.title) + '</h3><p class="d">' + esc(t.text) + '</p></article></div>';
}).join("") +
 '<div class="cell plus" aria-hidden="true"><svg viewBox="0 0 54 54" fill="none"><path d="M27 2v50M2 27h50"/></svg></div>';

var tiles = [].slice.call(grid.querySelectorAll(".tile")), current = -1, timer = null, paused = false;

function setActive(i){
  current = (i + tiles.length) % tiles.length;
  tiles.forEach(function(t, n){
    var on = n === current;
    if (on && !t.classList.contains("active")) { t.classList.remove("active"); void t.offsetWidth; } // restart ring
    t.classList.toggle("active", on);
  });
}
function tick(){ setActive(current + 1); timer = setTimeout(tick, DWELL); }
function play(){ clearTimeout(timer); paused = false; if (current < 0) setActive(0); timer = setTimeout(tick, DWELL); }
function pause(t){
  clearTimeout(timer); paused = true;
  tiles.forEach(function(x){ x.classList.toggle("open", x === t); x.classList.toggle("active", x === t); });
  current = tiles.indexOf(t);
}
function release(t){ t.classList.remove("open"); play(); }

tiles.forEach(function(t){
  t.addEventListener("mouseenter", function(){ pause(t); });
  t.addEventListener("mouseleave", function(){ release(t); });
  t.addEventListener("focus", function(){ pause(t); });   // keyboard and tap
  t.addEventListener("blur",  function(){ release(t); });
});
document.addEventListener("visibilitychange", function(){ if (document.hidden) clearTimeout(timer); else if (!paused) play(); });
play();
</script>
</body>
</html>
